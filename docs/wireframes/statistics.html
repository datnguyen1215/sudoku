<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics - Sudoku App Wireframe</title>
    <link rel="stylesheet" href="shared-styles.css" />
  </head>
  <body>
    <div class="wireframe-container">
      <div class="header">
        <h1>Sudoku App - Statistics</h1>
        <p>Your game performance and achievements</p>
      </div>

      <div class="screen-wrapper">
        <h2 class="screen-title">Statistics</h2>
        <div class="mobile-frame">
          <div class="status-bar">
            <span>9:41</span>
            <span>⚡ 🔋 📶</span>
          </div>
          <div class="screen-content">
            <div class="stats-screen">
              <div class="game-header">
                <span class="back-arrow">←</span>
                <span style="font-weight: bold">Statistics</span>
                <span></span>
              </div>
              <div class="stats-card">
                <div class="stat-label">Games Played</div>
                <div class="stat-value">142</div>
              </div>
              <div class="stats-card">
                <div class="stat-label">Games Won</div>
                <div class="stat-value">128</div>
              </div>
              <div class="stats-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value">90.1%</div>
              </div>
              <div class="stats-card">
                <h4 style="color: #4a2c2a; margin-bottom: 10px">
                  Best Times
                </h4>
                <div class="stat-row">
                  <span>Easy</span>
                  <span style="color: #d2691e; font-weight: bold">3:42</span>
                </div>
                <div class="stat-row">
                  <span>Medium</span>
                  <span style="color: #d2691e; font-weight: bold">7:15</span>
                </div>
                <div class="stat-row">
                  <span>Hard</span>
                  <span style="color: #d2691e; font-weight: bold">12:08</span>
                </div>
                <div class="stat-row">
                  <span>Expert</span>
                  <span style="color: #d2691e; font-weight: bold">18:55</span>
                </div>
              </div>
              <div class="stats-card">
                <div class="stat-label">Current Streak</div>
                <div class="stat-value">🔥 15</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <a href="index.html" style="color: #8b6b47; text-decoration: none; font-size: 16px;">
          ← Back to All Wireframes
        </a>
      </div>
    </div>
  </body>
</html>
