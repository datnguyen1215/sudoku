<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#667eea" rx="64"/>
  <rect x="64" y="64" width="384" height="384" fill="none" stroke="white" stroke-width="8"/>
  <!-- Main grid lines -->
  <g stroke="white" stroke-width="4">
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
  </g>
