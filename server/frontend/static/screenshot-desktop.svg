<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#667eea"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="100" fill="#5a67d8"/>
  <text x="600" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Sudoku - Mobile-First Puzzle Game</text>
  
  <!-- Main Content -->
  <g transform="translate(200, 150)">
    <!-- Game Grid -->
    <rect x="0" y="0" width="450" height="450" fill="white" rx="12"/>
    <g stroke="#333" stroke-width="3">
      <rect x="0" y="0" width="450" height="450" fill="none"/>
      <!-- Main grid lines -->
      <line x1="150" y1="0" x2="150" y2="450"/>
      <line x1="300" y1="0" x2="300" y2="450"/>
      <line x1="0" y1="150" x2="450" y2="150"/>
      <line x1="0" y1="300" x2="450" y2="300"/>
    </g>
    
    <!-- Sub grid lines -->
    <g stroke="#ccc" stroke-width="1">
      <line x1="50" y1="0" x2="50" y2="450"/>
      <line x1="100" y1="0" x2="100" y2="450"/>
      <line x1="200" y1="0" x2="200" y2="450"/>
      <line x1="250" y1="0" x2="250" y2="450"/>
      <line x1="350" y1="0" x2="350" y2="450"/>
      <line x1="400" y1="0" x2="400" y2="450"/>
      
      <line x1="0" y1="50" x2="450" y2="50"/>
      <line x1="0" y1="100" x2="450" y2="100"/>
      <line x1="0" y1="200" x2="450" y2="200"/>
      <line x1="0" y1="250" x2="450" y2="250"/>
      <line x1="0" y1="350" x2="450" y2="350"/>
      <line x1="0" y1="400" x2="450" y2="400"/>
    </g>
    
    <!-- Sample numbers -->
    <g fill="#333" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">
      <text x="25" y="35">5</text>
      <text x="125" y="35">3</text>
      <text x="425" y="35">7</text>
      <text x="75" y="85">9</text>
      <text x="325" y="85">1</text>
      <text x="25" y="135">2</text>
      <text x="225" y="135">8</text>
      <text x="425" y="135">4</text>
      <text x="175" y="185">6</text>
      <text x="275" y="185">3</text>
      <text x="375" y="185">9</text>
    </g>
    
    <!-- Selected cell highlight -->
    <rect x="100" y="100" width="50" height="50" fill="#667eea" fill-opacity="0.3" stroke="#667eea" stroke-width="3"/>
  </g>
  
  <!-- Controls Panel -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="300" height="450" fill="rgba(255,255,255,0.1)" rx="12"/>
    
    <!-- Difficulty -->
    <text x="150" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Difficulty</text>
    <rect x="50" y="60" width="60" height="30" fill="white" rx="4"/>
    <text x="80" y="80" text-anchor="middle" fill="#667eea" font-family="Arial, sans-serif" font-size="14">Easy</text>
    <rect x="120" y="60" width="60" height="30" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="150" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Medium</text>
    <rect x="190" y="60" width="60" height="30" fill="rgba(255,255,255,0.2)" rx="4"/>
    <text x="220" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Hard</text>
    
    <!-- Action Buttons -->
    <rect x="50" y="120" width="200" height="40" fill="#28a745" rx="6"/>
    <text x="150" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">New Game</text>
    
    <rect x="50" y="180" width="200" height="40" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="150" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">Hint</text>
    
    <rect x="50" y="240" width="200" height="40" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="150" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">Undo</text>
    
    <!-- Number Pad -->
    <text x="150" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">Number Pad</text>
    
    <g fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2">
      <circle cx="80" cy="360" r="25"/>
      <circle cx="130" cy="360" r="25"/>
      <circle cx="180" cy="360" r="25"/>
      <circle cx="80" cy="410" r="25"/>
      <circle cx="130" cy="410" r="25"/>
      <circle cx="180" cy="410" r="25"/>
    </g>
    
    <g fill="white" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="80" y="368">1</text>
      <text x="130" y="368">2</text>
      <text x="180" y="368">3</text>
      <text x="80" y="418">4</text>
      <text x="130" y="418">5</text>
      <text x="180" y="418">6</text>
    </g>
  </g>
  
  <!-- Game Info -->
  <text x="600" y="740" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">Time: 02:45 | Difficulty: Medium | Modern mobile-first design</text>
</svg>