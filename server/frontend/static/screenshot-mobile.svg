<svg width="375" height="812" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="812" fill="#667eea"/>
  <!-- Header -->
  <rect x="0" y="0" width="375" height="120" fill="#5a67d8"/>
  <text x="187.5" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Sudoku</text>
  <text x="187.5" y="95" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Time: 02:45 | Medium</text>
  
  <!-- Game Grid -->
  <rect x="37.5" y="160" width="300" height="300" fill="white" rx="8"/>
  <g stroke="#333" stroke-width="2">
    <rect x="37.5" y="160" width="300" height="300" fill="none"/>
    <!-- Grid lines -->
    <line x1="137.5" y1="160" x2="137.5" y2="460"/>
    <line x1="237.5" y1="160" x2="237.5" y2="460"/>
    <line x1="37.5" y1="260" x2="337.5" y2="260"/>
    <line x1="37.5" y1="360" x2="337.5" y2="360"/>
  </g>
  
  <!-- Sample numbers -->
  <g fill="#333" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
    <text x="87.5" y="200">5</text>
    <text x="187.5" y="200">3</text>
    <text x="287.5" y="200">7</text>
    <text x="87.5" y="300">2</text>
    <text x="287.5" y="300">1</text>
    <text x="87.5" y="400">8</text>
    <text x="187.5" y="400">4</text>
    <text x="287.5" y="400">6</text>
  </g>
  
  <!-- Number Pad -->
  <rect x="37.5" y="500" width="300" height="200" fill="rgba(255,255,255,0.1)" rx="8"/>
  <text x="187.5" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16">Number Pad</text>
  
  <!-- Sample buttons -->
  <g fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1">
    <circle cx="87.5" cy="570" r="20"/>
    <circle cx="137.5" cy="570" r="20"/>
    <circle cx="187.5" cy="570" r="20"/>
    <circle cx="237.5" cy="570" r="20"/>
    <circle cx="287.5" cy="570" r="20"/>
  </g>
  
  <g fill="white" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="87.5" y="577">1</text>
    <text x="137.5" y="577">2</text>
    <text x="187.5" y="577">3</text>
    <text x="237.5" y="577">4</text>
    <text x="287.5" y="577">5</text>
  </g>
  
  <!-- Control buttons -->
  <rect x="37.5" y="620" width="90" height="40" fill="#28a745" rx="4"/>
  <text x="82.5" y="645" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">New Game</text>
  
  <rect x="142.5" y="620" width="90" height="40" fill="rgba(255,255,255,0.2)" rx="4"/>
  <text x="187.5" y="645" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Hint</text>
  
  <rect x="247.5" y="620" width="90" height="40" fill="rgba(255,255,255,0.2)" rx="4"/>
  <text x="292.5" y="645" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Undo</text>
</svg>